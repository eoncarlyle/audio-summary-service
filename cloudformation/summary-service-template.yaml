AWSTemplateFormatVersion: "2010-09-09"
Resources:
  SchmittAwsLabAudioSummaryMp3:
    Type: AWS::S3::Bucket
    DependsOn: S3InvokeLambdaPermission
    DeletionPolicy: Delete
    Properties:
      BucketName: "schmitt-aws-lab-audio-summary-mp3"
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt AudioSummaryS3Lambda.Arn

  SchmittAwsLabAudioSummaryFeed:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: "schmitt-aws-lab-audio-summary-feed"

  SchmittAwsLabLambdaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: "schmitt-aws-lab-lambda"

  AudioSummaryBatchesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "audio-summary-batches"
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: resourceLink
          AttributeType: S
        # document store: thought I needed to provide these, maybe I'm too relational brained
        #- AttributeName: geminiBatchName
        #  AttributeType: S
        #- AttributeName: geminiFileName
        #  AttributeType: S
        #- AttributeName: createdAt
        #  AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: resourceLink
          KeyType: RANGE
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  # Used for MP3 files dropped into `schmitt-aws-lab-audio-summary-mp3`
  AudioSummaryS3Lambda:
    Type: AWS::Lambda::Function
    Properties:
      Role: arn:aws:iam::331867785991:role/AudioSummaryS3LambdaRole
      Runtime: nodejs24.x
      Handler: index.handler
      FunctionName: schmitt-aws-lab-audio-summary-s3
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 200 });


  S3InvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    DependsOn: AudioSummaryS3Lambda
    Properties:
      FunctionName: !GetAtt AudioSummaryS3Lambda.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: "arn:aws:s3:::schmitt-aws-lab-audio-summary-mp3"

  # Used for requests with link + metadata specified
  AudioSummaryLinkedLambda:
    Type: AWS::Lambda::Function
    Properties:
      Role: arn:aws:iam::331867785991:role/AudioSummaryLinkedLambdaRole
      Runtime: nodejs24.x
      Handler: index.handler
      FunctionName: schmitt-aws-lab-audio-summary-linked
      Timeout: 900
      MemorySize: 512
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 200 });

  # Polls DynamoDB for completed Gemini batch jobs and updates feeds
  AudioSummarySyncLambda:
    Type: AWS::Lambda::Function
    Properties:
      Role: arn:aws:iam::331867785991:role/AudioSummarySyncLambdaRole
      Runtime: nodejs24.x
      Handler: index.handler
      FunctionName: schmitt-aws-lab-audio-summary-sync
      Timeout: 900
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 200 });

  # Truncates feeds to max 25 items
  AudioSummaryTruncateLambda:
    Type: AWS::Lambda::Function
    Properties:
      Role: arn:aws:iam::331867785991:role/AudioSummaryTruncateLambdaRole
      Runtime: nodejs24.x
      Handler: index.handler
      FunctionName: schmitt-aws-lab-audio-summary-truncate
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 200 });

  # HTTP endpoint to retrieve feed JSON
  AudioSummaryGetLambda:
    Type: AWS::Lambda::Function
    Properties:
      Role: arn:aws:iam::331867785991:role/AudioSummaryGetLambdaRole
      Runtime: nodejs24.x
      Handler: index.handler
      FunctionName: schmitt-aws-lab-audio-summary-get
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 200 });

  # EventBridge Scheduler - runs sync every 10 minutes
  AudioSummarySyncSchedule:
    Type: AWS::Scheduler::Schedule
    DependsOn: AudioSummarySyncLambda
    Properties:
      Name: "audio-summary-sync-schedule"
      ScheduleExpression: "cron(0/10 * * * ? *)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt AudioSummarySyncLambda.Arn
        RoleArn: "arn:aws:iam::331867785991:role/AudioSummarySchedulerRole"

  # EventBridge Scheduler - runs truncate every 10 minutes
  AudioSummaryTruncateSchedule:
    Type: AWS::Scheduler::Schedule
    DependsOn: AudioSummaryTruncateLambda
    Properties:
      Name: "audio-summary-truncate-schedule"
      ScheduleExpression: "cron(0/10 * * * ? *)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt AudioSummaryTruncateLambda.Arn
        RoleArn: "arn:aws:iam::331867785991:role/AudioSummarySchedulerRole"
